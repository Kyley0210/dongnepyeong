<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>동네평</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
a,button,input,select,textarea,label{touch-action:manipulation}
/* Layout idea: a local-life app shell. Sticky header (top tabs + search), category icon pager, two pick cards, then a two-column photo feed. Shops without photos appear as street signboards (간판); the brand mark is a red ink stamp (도장). */
:root{
  --desk:#E4E6E5; --bg:#F2F2F0; --surface:#FFFFFF; --fill:#F1F1EF; --press:#E8E8E5;
  --ink:#1A1C1B; --muted:#6B706D; --line:#E2E3E0;
  --brand:#DE3B28; --on-brand:#FFFFFF; --brand-soft:#FDECE8; --star:#F0A30A;
  --warn-bg:#FFF4D6; --warn-ink:#5C4300;
  --font-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --tab-h:60px; --app-w:440px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#060707; --bg:#0F1110; --surface:#1A1D1C; --fill:#232726; --press:#2A2F2D;
    --ink:#ECEEED; --muted:#9BA19E; --line:#2C302E;
    --brand:#FF6A55; --on-brand:#1E0905; --brand-soft:#3A1D18; --star:#F6C04B;
    --warn-bg:#3A3112; --warn-ink:#F4E2A6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#060707; --bg:#0F1110; --surface:#1A1D1C; --fill:#232726; --press:#2A2F2D;
  --ink:#ECEEED; --muted:#9BA19E; --line:#2C302E;
  --brand:#FF6A55; --on-brand:#1E0905; --brand-soft:#3A1D18; --star:#F6C04B;
  --warn-bg:#3A3112; --warn-ink:#F4E2A6; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;overscroll-behavior-y:none}
body.locked .phone{overflow:hidden}
h1,h2,h3{font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
svg{display:block}
img{max-width:100%}
.phone{max-width:var(--app-w);margin:0 auto;height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;background:var(--bg);position:relative;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px)}
@media (min-width:600px){.phone{box-shadow:0 0 0 1px var(--line),0 24px 64px rgba(0,0,0,.14)}}
.ic{display:inline-grid;place-items:center}
.ic svg{width:24px;height:24px}

/* home header */
.homehead{position:sticky;top:0;z-index:20;background:var(--surface);padding-top:env(safe-area-inset-top)}
.toptabs{display:flex;gap:22px;padding:10px 16px 2px;overflow-x:auto;scrollbar-width:none}
.toptabs::-webkit-scrollbar{display:none}
.tt{background:none;border:0;padding:4px 0 8px;font-size:19px;font-weight:500;color:var(--muted);position:relative;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:2px}
.tt[aria-pressed="true"]{color:var(--ink);font-weight:700}
.tt[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:0;width:18px;height:3px;border-radius:2px;background:var(--brand);transform:translateX(-50%)}
.tt .caret{font-size:11px;margin-left:2px}
.srch{display:flex;align-items:center;gap:10px;padding:8px 16px 10px}
.logo{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--brand);color:var(--brand);font-family:var(--font-display);font-size:22px;
  display:grid;place-items:center;transform:rotate(-10deg);flex:none;line-height:1;text-decoration:none}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:2px solid var(--brand);border-radius:999px;height:46px;padding:0 4px 0 14px;background:var(--surface)}
.sbox .ic{color:var(--muted)}
.sbox .ic svg{width:20px;height:20px}
.sbox input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:100%;font-size:16px}
.sgo{flex:none;height:36px;border-radius:999px;background:var(--brand);color:var(--on-brand);border:0;padding:0 16px;font-weight:600;cursor:pointer}

/* category pager */
.cats{background:var(--surface)}
.catpager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.catpager::-webkit-scrollbar{display:none}
.catpage{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(5,1fr);row-gap:14px;padding:12px 6px 6px}
.cbtn{display:grid;justify-items:center;gap:6px;background:none;border:0;font-size:13px;color:var(--ink);text-decoration:none;cursor:pointer;padding:0}
.cbtn i{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-family:var(--font-display);font-style:normal;font-size:24px;color:#fff;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),inset 0 10px 14px rgba(255,255,255,.2)}
.dots{display:flex;justify-content:center;gap:4px;padding:6px 0 12px}
.dots i{width:6px;height:3px;border-radius:2px;background:var(--line)}
.dots i.on{width:14px;background:var(--brand)}

/* pick cards */
.promos{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 8px 0}
.promo{border-radius:12px;padding:10px;text-decoration:none;color:inherit;display:grid;gap:8px;background:linear-gradient(180deg,var(--brand-soft),var(--surface) 60%);border:1px solid var(--line);min-width:0}
.promo h3{font-size:15px;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.promo h3 small{font-weight:400;color:var(--muted);font-size:12px}
.pbody{display:flex;gap:8px;align-items:center;min-width:0}
.pbody div{min-width:0}
.pbody b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.pbody small{font-size:12px;color:var(--brand)}
.pbody small span{color:var(--muted);margin-left:4px}

/* signboard thumbs */
.thumb{width:78px;height:78px;border-radius:10px;flex:none;color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:36px;position:relative;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb::before,.hero::before,.fsign::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;z-index:1;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 12px,rgba(255,255,255,.2) 12px 24px)}
.thumb.has-img::before{display:none}
.thumb.sm{width:48px;height:48px;border-radius:8px;font-size:22px}
.thumb.sm::before{height:4px}
.thumb.xs{width:40px;height:40px;border-radius:8px;font-size:20px}
.thumb.xs::before{height:4px}

/* feed */
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;align-items:start}
.mcol{display:grid;gap:8px;min-width:0}
.fcard{background:var(--surface);border-radius:10px;overflow:hidden;min-width:0}
.flink{display:block;text-decoration:none;color:inherit}
.fmedia{position:relative;display:block;background:var(--fill)}
.fmedia img{width:100%;display:block;max-height:300px;min-height:140px;object-fit:cover}
.fsign{position:relative;color:#fff;padding:24px 12px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.fsign small{font-size:12px;opacity:.92}
.fsign strong{font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.1;overflow-wrap:anywhere}
.ftag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:999px;padding:2px 8px;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.fcount{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;z-index:1}
.ftitle{padding:8px 10px 2px;font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ffoot{display:flex;align-items:center;gap:6px;padding:6px 10px 10px;font-size:12px;color:var(--muted)}
.ffoot .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:22px;height:22px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none}
.like{display:inline-flex;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:6px;margin:-6px;font-variant-numeric:tabular-nums}
.like svg{width:18px;height:18px}
.like[aria-pressed="true"]{color:var(--brand)}
.like[aria-pressed="true"] svg{fill:currentColor}

/* lists */
.list{background:var(--surface)}
.srow{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;align-items:flex-start}
.srow:active{background:var(--press)}
.rank{width:22px;flex:none;font-family:var(--font-display);font-size:22px;color:var(--muted);text-align:center;padding-top:24px;font-variant-numeric:tabular-nums}
.rank.top{color:var(--brand)}
.sinfo{min-width:0;flex:1;display:grid;gap:1px;align-content:start}
.sname{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.score{display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;font-size:13px;color:var(--muted)}
.score b{color:var(--brand);font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.1}
.score .new{color:var(--brand);font-weight:600}
.sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.menuline{font-size:13px;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:11px;font-weight:500;border:1px solid var(--muted);color:var(--muted);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px 16px;display:flex;align-items:center;gap:8px;min-height:56px}
.appbar.withback{padding-left:4px}
.appbar .title{flex:1;min-width:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sbox{height:40px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;text-decoration:none}
.iconbtn:active{background:var(--press)}
.seg{display:flex;gap:18px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.seg button{background:none;border:0;padding:10px 0 8px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:700;border-color:var(--ink)}

/* store detail */
.hero{position:relative;color:#fff;padding:30px 20px 20px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.7))}
.hero.has-img::before{display:none}
.hero small,.hero strong{position:relative;z-index:1}
.hero small{font-size:13px;opacity:.92}
.hero strong{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:1.1;overflow-wrap:anywhere}
.block{background:var(--surface);padding:16px;margin:10px 10px 0;border-radius:18px;border:1px solid var(--line)}
.block-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.block-h>.ic svg{width:20px;height:20px;color:var(--brand)}
.block-h small{margin-left:auto;background:var(--fill);border-radius:999px;padding:1px 9px;font-weight:700}
.block-h h2{font-size:18px}
.block-h small{color:var(--muted);font-size:14px}
.summary{display:flex;align-items:center;gap:20px}
.stamp{flex:none;width:96px;height:96px;border-radius:50%;border:4px solid var(--brand);color:var(--brand);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);line-height:1}
.stamp b{font-family:var(--font-display);font-weight:400;font-size:40px;font-variant-numeric:tabular-nums}
.stamp span{font-size:12px;margin-top:4px}
.stamp.none{border-style:dashed;border-color:var(--line);color:var(--muted);transform:none}
.stamp.none span{text-align:center;line-height:1.3;margin:0}
.bars{flex:1;display:grid;gap:5px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.bars div{display:grid;grid-template-columns:26px 1fr 20px;gap:8px;align-items:center}
.bars i{display:block;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bars i u{display:block;height:100%;background:var(--star)}
.info{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.info dt{color:var(--muted)}
.info dd{margin:0;overflow-wrap:anywhere}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:96px;height:96px;padding:0;border:0;border-radius:8px;overflow:hidden;background:var(--fill);cursor:zoom-in}
.strip img,.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.rv{padding:14px 0;border-top:1px solid var(--line)}
.rv:first-of-type{border-top:0;padding-top:4px}
.rv-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted);flex:none}
.rv-who{display:grid;line-height:1.3;min-width:0}
.rv-who b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.rv-who time{font-size:12px;color:var(--muted)}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap;font-size:14px}
.stars s{text-decoration:none;color:var(--line)}
.rv-text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.pgrid button{padding:0;border:0;border-radius:6px;overflow:hidden;aspect-ratio:1;background:var(--fill);cursor:zoom-in}
.reply{margin-top:10px;background:var(--fill);border-radius:10px;padding:10px 12px;font-size:14px}
.reply b{display:block;font-size:12px;color:var(--brand);font-weight:700;margin-bottom:2px}
.reply span{white-space:pre-wrap;overflow-wrap:anywhere}
.rv-actions{display:flex;gap:4px;margin-top:6px;align-items:center}
.textbtn{background:none;border:0;padding:6px 8px;margin-left:-8px;font-size:13px;color:var(--brand);font-weight:600;cursor:pointer;border-radius:6px}
.textbtn:active{background:var(--press)}

/* my / boss */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--fill);border-radius:12px;padding:12px;display:grid;gap:2px}
.tile b{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .grow{flex:1;min-width:0;text-decoration:none;color:inherit}
.mrow .grow b{display:block;font-weight:600;overflow-wrap:anywhere}
.mrow .grow small{color:var(--muted);font-size:13px;overflow-wrap:anywhere;display:block}
.mbtns{display:flex;gap:6px;flex:none}

/* buttons, forms */
.btn{border:0;background:var(--brand);color:var(--on-brand);border-radius:12px;height:50px;padding:0 18px;font-weight:700;font-size:16px;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{filter:brightness(.92)}
.btn .ic svg{width:20px;height:20px}
.btn.wide{width:100%}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn.small{height:34px;border-radius:8px;font-size:13px;padding:0 12px;font-weight:600;background:var(--fill);color:var(--ink)}
.btn.small.hot{background:var(--brand);color:var(--on-brand)}
.btn.danger{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
form{display:grid;gap:16px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
label small,.lbl small{font-weight:400;color:var(--muted)}
.lbl{font-size:14px;font-weight:600;margin-bottom:6px}
input[type=text],input[type=tel],select,textarea{background:var(--fill);border:1.5px solid transparent;border-radius:10px;padding:12px;width:100%;font-size:16px}
input[type=text]:focus,input[type=tel]:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;background:var(--surface)}
textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rate{display:flex;justify-content:center;gap:4px;border:0;padding:0;margin:0}
.rate legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate label{display:block;font-size:42px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.rate label.on{color:var(--star)}
.rate input:focus-visible+label{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.rate-word{text-align:center;font-size:14px;color:var(--muted);min-height:1.5em;margin-top:-6px}
.picker{display:flex;gap:8px;flex-wrap:wrap}
.pthumb{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;background:var(--fill)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .rm{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;padding:0}
.pthumb .rm svg{width:16px;height:16px}
.padd{width:80px;height:80px;border:1.5px dashed var(--muted);border-radius:8px;display:grid;place-items:center;align-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;text-align:center}
.padd input{position:absolute;width:1px;height:1px;opacity:0}
.padd:focus-within{outline:3px solid var(--brand)}
.err{color:var(--brand);font-size:14px;min-height:1.4em}
.notice{background:var(--warn-bg);color:var(--warn-ink);padding:10px 14px;font-size:13px}
.empty{padding:40px 24px;text-align:center;color:var(--muted);display:grid;gap:14px;justify-items:center}
.lead{color:var(--muted);font-size:14px;margin-bottom:16px}
.optlist{display:grid}
.opt{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.opt:first-child{border-top:0}
.opt:active{background:var(--press)}
.opt .grow{flex:1;min-width:0}
.opt .grow b{display:block;font-weight:600;overflow-wrap:anywhere}
.opt .grow small{color:var(--muted);font-size:13px}
.opt[aria-current="true"] b{color:var(--brand)}

/* fixed bars */
.tabbar,.actionbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--app-w);background:var(--surface);border-top:1px solid var(--line);z-index:30}
.tabbar{height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.tab{display:grid;place-items:center;align-content:center;gap:2px;height:100%;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.tab .ic svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--brand);font-weight:700}
.tab.pill span{display:inline-flex;align-items:center;gap:2px;background:var(--brand);color:var(--on-brand);border-radius:999px;height:40px;padding:0 14px 0 10px;font-weight:700;font-size:15px;white-space:nowrap}
.tab.pill .ic svg{width:18px;height:18px}
body.no-tabs .tabbar,body.no-tabs .fab{display:none}

/* added: settings, translation notes, address row */

a.opt{text-decoration:none;color:inherit}

/* added: closed days, delete dialog */
.daypick{display:flex;flex-wrap:wrap;gap:6px}

/* added: gallery, adult badge, check row */
.galwrap{position:relative;background:var(--surface)}

/* added: hours/phone pickers, photo strips */

function h(tag,attrs){

    var v=attrs[k];

    if(k==="text")el.textContent=v;
    else if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),v);
    else if(k==="class")el.className=v;
    else if(k==="value")el.value=v;
    else if(k==="style")el.style.cssText=v;

  for(i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(c==null||c===false)continue;

}

function fmtDate(ms){

  var m=Math.floor((Date.now()-ms)/60000);
  if(m<1)return T("방금");if(m<60)return m+T("분 전");
  var hr=Math.floor(m/60);if(hr<24)return hr+T("시간 전");
  var d=Math.floor(hr/24);if(d<7)return d+T("일 전");
  var dt=new Date(ms);return dt.getFullYear()+". "+(dt.getMonth()+1)+". "+dt.getDate()+".";

function detectLang(t){
  if(!t)return null;
  var ko=(t.match(/[가-힣]/g)||[]).length,kana=(t.match(/[぀-ヿ]/g)||[]).length,
      han=(t.match(/[一-鿿]/g)||[]).length,lat=(t.match(/[A-Za-z]/g)||[]).length;
  if(ko&&ko*2>=han&&ko>=kana)return"ko";
  if(kana)return"ja";
  if(han)return"zh";
  if(lat>=3)return"en";
  return null;
}

var memo={v:-1};
function M(){
  if(memo.v===S.ver)return memo;
  var m={v:S.ver,stores:[],byId:{},reviews:[],byStore:{},stats:{},likeCount:{},myLikes:{},likeAt:{},favCount:{},myFavs:{},favAt:{}};
  S.stores.forEach(function(items,owner){
    if(!items||typeof items!=="object")return;
    Object.keys(items).forEach(function(id){
      var s=items[id];
      if(!s||typeof s!=="object"||!/^[a-z0-9]{6,20}$/.test(id))return;
      var name=str(s.name,30).trim();if(!name)return;
      var st={id:id,owner:owner,name:name,cat:normCat(s.cat),
        area:str(s.area,30),address:str(s.address,80),hours:str(s.hours,60),phone:str(s.phone,20),
        price:PRICES.indexOf(s.price)>=0?s.price:"",menu:str(s.menu,80),desc:str(s.desc,600),
        photo:cleanIds([s.photo],1)[0]||"",photos:cleanIds(s.photos,10),video:cleanVid(s.video),ownerName:bossName(owner)||str(s.ownerName,20).trim(),chain:s.chain===true,reserve:s.reserve===true,addrKey:str(s.addrKey,100),adult:s.adult===true,open:isTime(s.open)?s.open:"",close:isTime(s.close)?s.close:"",h24:s.h24===true,closed:Array.isArray(s.closed)?s.closed.filter(function(c,i,a){return CLOSED_CODES.indexOf(c)>=0&&a.indexOf(c)===i}):[],createdAt:typeof s.createdAt==="number"?s.createdAt:0,example:owner==="example"};
      m.stores.push(st);m.byId[id]=st;m.byStore[id]=[];
    });
  });
  S.reviews.forEach(function(items,author){
    if(!items||typeof items!=="object")return;
    Object.keys(items).forEach(function(sid){
      var store=m.byId[sid],r=items[sid];
      if(!store||!r||typeof r!=="object")return;
      var rating=Math.round(Number(r.rating));
      if(!(rating>=1&&rating<=5))return;
      var pf=profOf(author);
      var rv={author:author,store:store,key:sid+"_"+author,rating:rating,text:str(r.text,1000),
        nick:pf?pf.name:(str(r.nick,12).trim()||T("익명 손님")),tag:pf?pf.tag:"",photos:cleanIds(r.photos,3),video:cleanVid(r.video),
        createdAt:typeof r.createdAt==="number"?r.createdAt:0,edited:!!r.edited};
      m.reviews.push(rv);m.byStore[sid].push(rv);
    });
  });
  m.reviews.sort(function(a,b){return b.createdAt-a.createdAt});
  m.stores.forEach(function(s){
    var list=m.byStore[s.id].sort(function(a,b){return b.createdAt-a.createdAt}),sum=0,dist=[0,0,0,0,0];
    list.forEach(function(r){sum+=r.rating;dist[r.rating-1]++});
    m.stats[s.id]={n:list.length,avg:list.length?sum/list.length:0,dist:dist,list:list};
  });
  S.likes.forEach(function(items,uid){
    if(!items||typeof items!=="object")return;
    Object.keys(items).forEach(function(k){
      var v=items[k];if(v!==true&&typeof v!=="number")return;
      m.likeCount[k]=(m.likeCount[k]||0)+1;if(uid===S.uid)m.myLikes[k]=true;
      if(typeof v==="number"){var sid=k.split("_")[0];(m.likeAt[sid]=m.likeAt[sid]||[]).push(v)}
    });
  });
  S.favs.forEach(function(items,uid){
    if(!items||typeof items!=="object")return;
    Object.keys(items).forEach(function(sid){
      var v=items[sid];if(typeof v!=="number"||!m.byId[sid])return;
      m.favCount[sid]=(m.favCount[sid]||0)+1;(m.favAt[sid]=m.favAt[sid]||[]).push(v);
      if(uid===S.uid)m.myFavs[sid]=v;
    });
  });
  memo=m;return m;
}
function stats(id){return M().stats[id]||{n:0,avg:0,dist:[0,0,0,0,0],list:[]}}
function replyOf(store,author){
  var items=S.replies.get(store.owner),r=items&&items[store.id+"_"+author];
  if(!r||typeof r!=="object")return null;
  var t=str(r.text,500).trim();
  return t?{text:t,createdAt:typeof r.createdAt==="number"?r.createdAt:0}:null;
}

function trendOf(days){
  var m=M(),since=Date.now()-days*DAY,out=[];
  m.stores.forEach(function(s){
    if(!inRegion(s))return;
    var r=stats(s.id).list.filter(function(x){return x.createdAt>=since}).length;
    var f=(m.favAt[s.id]||[]).filter(function(t){return t>=since}).length;
    var l=(m.likeAt[s.id]||[]).filter(function(t){return t>=since}).length;
    var score=r*3+f*2+l;
    if(score>0)out.push({s:s,r:r,f:f,l:l,score:score});
  });
  out.sort(function(a,b){return b.score-a.score||stats(b.s.id).avg-stats(a.s.id).avg});
  return out;

function cyrb53(str,seed){
  var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
  for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}

  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);

var DOCS={
  stores:{id:function(k){return k},data:function(k,v){var d=Object.assign({},v);d.ownerId=S.uid;return d}},
  reviews:{id:function(k){return k+"_"+S.uid},data:function(k,v){var d=Object.assign({},v);d.storeId=k;d.authorId=S.uid;return d}},
  replies:{id:function(k){return k},data:function(k,v){var i=k.indexOf("_"),d=Object.assign({},v);d.storeId=k.slice(0,i);d.authorId=k.slice(i+1);d.ownerId=S.uid;return d}},
  likes:{id:function(k){return k+"__"+S.uid},data:function(k,v){return{key:k,uid:S.uid,at:typeof v==="number"?v:Date.now()}}},
  favs:{id:function(k){return k+"_"+S.uid},data:function(k,v){return{storeId:k,uid:S.uid,at:v}}}

function mutate(coll,fn){
  var p=chain.then(function(){
    if(!S.fs||!canWriteNow())return Promise.reject({code:"auth"});
    var cur=JSON.parse(JSON.stringify(MAPS[coll].get(S.uid)||{})),next=JSON.parse(JSON.stringify(cur));
    fn(next);
    var keys=Object.keys(next),prep=Promise.resolve();
    if(coll==="stores")prep=Promise.all(keys.map(function(k){return addrKeyOf(next[k]).then(function(a){next[k].addrKey=a})}));
    return prep.then(function(){
      var b=fb.writeBatch(S.fs),n=0,D=DOCS[coll];
      keys.forEach(function(k){
        var before=cur[k]?JSON.stringify(strip(cur[k])):null;
        if(before===JSON.stringify(strip(next[k])))return;
        b.set(fb.doc(S.fs,coll,D.id(k)),D.data(k,coll==="likes"||coll==="favs"?next[k]:strip(next[k])));n++;
        if(coll==="stores"){
          var oldKey=cur[k]&&cur[k].addrKey;
          if(oldKey!==next[k].addrKey){
            b.set(fb.doc(S.fs,"addrKeys",next[k].addrKey),{storeId:k,ownerId:S.uid});
            if(oldKey)b.delete(fb.doc(S.fs,"addrKeys",oldKey));
          }

      Object.keys(cur).forEach(function(k){
        if(k in next)return;

      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej({code:"upload"})},"image/jpeg",0.84);

    img.onerror=function(){URL.revokeObjectURL(url);rej({code:"upload"})};
    img.src=url;
  });

  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){

      var c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(ht*sc));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);

// 무료 요금제: 사진을 압축해서 Firestore 문서(photos/{id})에 저장합니다. 한 장에 1MB 미만.

/* ---------- 영상 (무료 요금제): 15초 이하 영상을 작게 다시 만든 뒤, 0.9MB 조각으로 나눠 videos/{id}/c/{n} 에 저장 ----------

/* 브라우저 안에서 영상을 720p·낮은 화질로 다시 녹화해서 용량을 줄여요(영상 길이만큼 시간이 걸려요) */
function transcode(file,onPct){
  return new Promise(function(res,rej){
    var MR=window.MediaRecorder,cv=document.createElement("canvas");
    if(!MR||!cv.captureStream)return rej({code:"no-recorder"});
    var types=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
    var mime=types.filter(function(m){try{return MR.isTypeSupported(m)}catch(e){return false}})[0];
    if(!mime)return rej({code:"no-recorder"});

    v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";v.src=url;
    /* 화면 밖에 붙여 둬야 휴대폰 브라우저가 영상을 실제로 재생(디코딩)해요 */
    v.style.cssText="position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
    document.body.append(v);

    v.onerror=function(){cleanup();rej({code:"no-recorder"})};

        if(onPct&&dur)onPct(Math.min(99,Math.round(v.currentTime/dur*100)));

/* 고르자마자 준비를 시작: 길이 확인 → 줄이기. 결과는 Promise로 보관했다가 저장할 때 올림 */
function prepareVideo(file,onMsg){
  return videoMeta(file).then(function(m){
    if(m.duration>VID_MAX_SEC+0.9)return Promise.reject({msg:T("영상은 15초 이하만 올릴 수 있어요. 짧게 잘라서 다시 골라 주세요.")});
    return transcode(file,function(p){onMsg(T("영상 줄이는 중 ")+p+"%")}).then(function(b){return b&&b.size>20000?b:file}).catch(function(e){
      if(e&&e.msg)return Promise.reject(e);
      return file;   // 다시 만들기를 못 하는 브라우저: 원본이 작으면 그대로 사용
    });
  }).then(function(b){
    if(b.size>VID_MAX_BYTES)return Promise.reject({msg:T("영상 용량이 너무 커요. 더 짧게 찍거나 화질을 낮춰서 다시 골라 주세요.")});
    return b;
  });
}
function uploadVideo(blobv,onMsg){
  var id=newId()+newId(),n=Math.ceil(blobv.size/VID_CHUNK);
  return blobv.arrayBuffer().then(function(buf){
    var bytes=new Uint8Array(buf),i=0;
    function next(){
      if(i>=n)return fb.setDoc(fb.doc(S.fs,"videos",id),{ownerId:S.uid,n:n,type:blobv.type||"video/mp4",size:blobv.size,at:Date.now()});
      onMsg(T("영상 올리는 중 ")+(i+1)+"/"+n);
      var part=bytes.subarray(i*VID_CHUNK,Math.min(bytes.length,(i+1)*VID_CHUNK));
      return fb.setDoc(fb.doc(S.fs,"videos",id,"c",String(i)),{ownerId:S.uid,i:i,data:fb.Bytes.fromUint8Array(part)}).then(function(){i++;return next()});
    }
    return next();
  }).then(function(){VIDEO[id]=URL.createObjectURL(blobv);return"vd:"+id},function(e){
    dropVideo("vd:"+id);return Promise.reject(e&&e.msg?e:{msg:T("영상을 올리지 못했어요. 연결을 확인하고 다시 시도해 주세요.")});
  });
}
function loadVideo(vid){
  var id=vid.slice(3);
  if(VIDEO[id])return Promise.resolve(VIDEO[id]);
  return fb.getDoc(fb.doc(S.fs,"videos",id)).then(function(md){
    if(!md.exists())return Promise.reject({msg:T("영상을 찾을 수 없어요.")});
    var meta=md.data();
    return fb.getDocs(fb.collection(S.fs,"videos",id,"c")).then(function(snap){
      var parts=snap.docs.map(function(d){return d.data()}).sort(function(a,b){return a.i-b.i});
      if(parts.length<meta.n)return Promise.reject({msg:T("영상을 불러오지 못했어요.")});
      VIDEO[id]=URL.createObjectURL(new Blob(parts.map(function(p){return p.data.toUint8Array()}),{type:meta.type||"video/mp4"}));
      return VIDEO[id];
    });
  });
}
function dropVideo(vid){
  if(!cleanVid(vid)||!S.fs)return Promise.resolve();
  var id=vid.slice(3);
  return fb.getDocs(fb.collection(S.fs,"videos",id,"c")).then(function(snap){
    return Promise.all(snap.docs.map(function(d){return fb.deleteDoc(d.ref)}));
  }).then(function(){return fb.deleteDoc(fb.doc(S.fs,"videos",id))}).catch(function(){});

/* ---------- 사장님 이름: 한 사람당 하나(내 모든 가게에 같은 이름), 다른 사장님과 겹치면 안 됨 ---------- */

function itemKey(it){return it.kind==="notice"?"n:"+it.n.id:it.kind+":"+it.r.id+":"+it.r.status}
function inboxItems(){
  var items=[];
  S.notices.forEach(function(n){items.push({at:n.at,kind:"notice",n:n})});
  S.resvOut.forEach(function(r){if(!r.hideU&&(r.status==="accepted"||r.status==="declined"))items.push({at:r.statusAt||r.at,kind:"out",r:r})});
  S.resvOut.forEach(function(r){if(!r.hideU&&r.status==="cancelled"&&r.cancelledBy==="owner")items.push({at:r.statusAt||r.at,kind:"out",r:r})});
  S.resvIn.forEach(function(r){if(!r.hideO&&r.status==="pending")items.push({at:r.at,kind:"in",r:r})});
  S.resvIn.forEach(function(r){if(!r.hideO&&r.status==="cancelled"&&r.cancelledBy==="user")items.push({at:r.statusAt||r.at,kind:"incancel",r:r})});
  var dis=dismissed();
  return items.filter(function(it){return !dis[itemKey(it)]}).sort(function(a,b){return b.at-a.at});
}

S.calSel={};

  months.forEach(function(md){
    var y=md.getFullYear(),mo=md.getMonth(),first=new Date(y,mo,1,12).getDay(),n=new Date(y,mo+1,0).getDate();
    var grid=h("div",{class:"calgrid"},WEEK_KO.map(function(w,wi){return h("span",{class:"calw"+(wi===0?" sun":""),text:T(w)})}));
    for(var b=0;b<first;b++)grid.append(h("span",{}));

      var dt=new Date(y,mo,dd,12),k=dayKey(dt),c=cnt[k]||{a:0,p:0,n:0},off=closedFn?closedFn(dt):false;
      grid.append(h("button",{type:"button",class:"calday"+(k===sel?" sel":"")+(k===today?" today":"")+(off?" off":"")+(k<today?" past":"")+(c.n?" has":""),
        "aria-label":k+(c.a?" · "+T("확정 ")+c.a:"")+(c.p?" · "+T("대기 ")+c.p:""),onclick:function(){S.calSel[key]=k;render()}},
        h("span",{text:String(dd)}),c.a?h("small",{class:"calcnt ok",text:String(c.a)}):null,c.p?h("small",{class:"calcnt wait",text:String(c.p)}):null));
    })(dd)}

    track.scrollLeft=i*track.clientWidth;setLabel()},0);
  function go(d){track.scrollBy({left:d*track.clientWidth,behavior:"smooth"})}
  var dayList=list.filter(function(r){return r.date===sel}).sort(function(a,b){return a.time<b.time?-1:1});
  var selD=new Date(sel+"T12:00:00");

      h("div",{class:"calnav"},h("button",{type:"button",class:"iconbtn","aria-label":T("이전 달"),onclick:function(){go(-1)}},icon("back")),label,

      track,
      h("div",{class:"callegend"},h("span",{},h("i",{class:"dot ok"}),T("확정")),h("span",{},h("i",{class:"dot wait"}),T("대기")))),
    h("section",{class:"block"},h("div",{class:"block-h"},icon("cal"),h("h2",{text:(selD.getMonth()+1)+"/"+selD.getDate()+" ("+T(WEEK_KO[selD.getDay()])+")"}),h("small",{text:dayList.length+T("개")})),

function mixedFeed(reviews,stores){
  var out=[],ri=0,si=0;
  while(ri<reviews.length||si<stores.length){
    for(var k=0;k<2&&ri<reviews.length;k++)out.push(reviews[ri++]);
    if(si<stores.length)out.push({kind:"s",s:stores[si++],key:"s"+stores[si-1].id});
  }
  return out;
}
function feedBody(rs,stores){

    var more=h("div",{class:"feedmore"},h("button",{type:"button",class:"btn ghost",text:T("더 보기"),onclick:function(){S.feedN=n+20;refresh()}}));
    wrap.append(more);
    if(window.IntersectionObserver)setTimeout(function(){var io=new IntersectionObserver(function(es){if(es.some(function(e){return e.isIntersecting})){io.disconnect();S.feedN=n+20;refresh()}},{root:scroller,rootMargin:"400px"});io.observe(more)},50);

/* ---------- 계정 삭제: 본인 확인 → 내가 올린 데이터 모두 삭제 → 계정 삭제 ---------- */
function deleteMyData(){
  var uid=S.uid,refs=[];
  function add(coll,id){refs.push(fb.doc(S.fs,coll,id))}
  var st=S.stores.get(uid)||{};
  Object.keys(st).forEach(function(id){add("stores",id);if(st[id]&&st[id].addrKey)add("addrKeys",st[id].addrKey)});
  Object.keys(S.reviews.get(uid)||{}).forEach(function(sid){add("reviews",sid+"_"+uid)});
  Object.keys(S.replies.get(uid)||{}).forEach(function(k){add("replies",k)});
  Object.keys(S.likes.get(uid)||{}).forEach(function(k){add("likes",k+"__"+uid)});
  Object.keys(S.favs.get(uid)||{}).forEach(function(k){add("favs",k+"_"+uid)});
  var pf=profOf(uid);
  if(pf){add("handles",hkey(pf.name,pf.tag));add("users",uid)}
  var bn=bossName(uid);if(bn){add("bossNames",bkey(bn));add("bosses",uid)}
  S.resvIn.concat(S.resvOut).forEach(function(r){add("reservations",r.id)});
  S.notices.forEach(function(n){add("notices",n.id)});
  Object.keys(slotDocs).forEach(function(k){add("slots",k)});
  S.follows.forEach(function(f,id){if(f.from===uid||f.to===uid)add("follows",id)});
  return fb.getDocs(fb.query(fb.collection(S.fs,"videos"),fb.where("ownerId","==",uid))).then(function(vs){
    return Promise.all(vs.docs.map(function(vd){
      return fb.getDocs(fb.collection(S.fs,"videos",vd.id,"c")).then(function(cs){cs.docs.forEach(function(c){refs.push(c.ref)});refs.push(vd.ref)});
    }));
  }).then(function(){return fb.getDocs(fb.query(fb.collection(S.fs,"photos"),fb.where("ownerId","==",uid)))}).then(function(snap){
    snap.docs.forEach(function(d){refs.push(d.ref)});
    var p=Promise.resolve();
    for(var i=0;i<refs.length;i+=400)(function(part){
      p=p.then(function(){var b=fb.writeBatch(S.fs);part.forEach(function(r){b.delete(r)});return b.commit()});
    })(refs.slice(i,i+400));
    return p;
  });
}

function route(){
  var x=(location.hash||"#home").slice(1);
  if(x.indexOf("s-")===0)return{name:"store",id:x.slice(2)};
  if(x==="g-all")return{name:"all"};
  if(x.indexOf("resv-")===0)return{name:"resv",id:x.slice(5)};
  if(x.indexOf("u-")===0)return{name:"user",id:x.slice(2)};
  if(x.indexOf("g-")===0)return{name:"group",i:parseInt(x.slice(2),10)};
  if(["register","my","favs","boss","search","settings","admin","inbox","recent","myresv","resvlist"].indexOf(x)>=0)return{name:x};
  return{name:"home"};
}

function confirmDialog(opts){

  function close(){root.textContent="";document.removeEventListener("keydown",esc);if(prev&&prev.focus&&document.body.contains(prev))prev.focus()}

  var cancel=h("button",{type:"button",class:"btn ghost",text:T("취소"),onclick:function(){if(!busy)close()}});
  var ok=h("button",{type:"button",class:"btn",text:opts.okText||T("삭제하기"),onclick:function(){
    busy=true;ok.disabled=true;cancel.disabled=true;ok.textContent=T("삭제하는 중…");err.textContent="";
    opts.onOk().then(function(){close();if(opts.done)opts.done()},function(x){busy=false;ok.disabled=false;cancel.disabled=false;ok.textContent=opts.okText||T("삭제하기");err.textContent=writeError(x)});
  }});

    h("div",{class:"dlg-mark","aria-hidden":"true",text:"!"}),
    h("h2",{id:"dlg-t",text:opts.title}),
    h("div",{id:"dlg-b",class:"dlg-body"},opts.body.map(function(t){return h("p",{text:t})})),
    err,h("div",{class:"dlg-btns"},cancel,ok));
  var scrim=h("div",{class:"dscrim",onclick:function(e){if(e.target===scrim&&!busy)close()}},box);
  root.textContent="";root.append(scrim);

  setTimeout(function(){cancel.focus()},30);
}

function viewer(list,idx){
  if(typeof list==="string"){list=[{src:list}];idx=0}
  idx=idx||0;
  var root=document.getElementById("viewer-root");
  function close(){root.textContent="";document.removeEventListener("keydown",key)}
  var count=h("span",{class:"vcount"});
  var track=h("div",{class:"vtrack",onscroll:function(){upd()}},list.map(function(it){
    return h("div",{class:"vslide",onclick:function(e){if(e.target===e.currentTarget)close()}},h("img",{src:it.src,alt:it.tag||T("사진")}),it.tag?h("span",{class:"vtag",text:it.tag}):null);
  }));
  function cur(){return Math.round(track.scrollLeft/Math.max(1,track.clientWidth))}
  function upd(){count.textContent=(cur()+1)+" / "+list.length}
  function go(d){var i=Math.max(0,Math.min(list.length-1,cur()+d));track.scrollTo({left:i*track.clientWidth,behavior:"smooth"})}
  function key(e){if(e.key==="Escape")close();else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)}
  root.append(h("div",{class:"viewer",role:"dialog","aria-label":T("사진 크게 보기")},track,
    list.length>1?h("button",{type:"button",class:"vnav prev","aria-label":T("이전 사진"),onclick:function(){go(-1)}},icon("back")):null,
    list.length>1?h("button",{type:"button",class:"vnav next","aria-label":T("다음 사진"),onclick:function(){go(1)}},icon("chev")):null,
    list.length>1?count:null,
    h("button",{type:"button",class:"iconbtn vclose","aria-label":T("닫기"),onclick:close},icon("close"))));
  track.scrollLeft=idx*track.clientWidth;upd();

  reviews:function(map,d){var x=d.data();if(!x.authorId||!x.storeId)return;var m=map.get(x.authorId)||{};m[x.storeId]=x;map.set(x.authorId,m)},
  replies:function(map,d){var x=d.data();if(!x.ownerId)return;var m=map.get(x.ownerId)||{};m[x.storeId+"_"+x.authorId]=x;map.set(x.ownerId,m)},
  likes:function(map,d){var x=d.data();if(!x.uid||!x.key)return;var m=map.get(x.uid)||{};m[x.key]=x.at;map.set(x.uid,m)},
  favs:function(map,d){var x=d.data();if(!x.uid||!x.storeId)return;var m=map.get(x.uid)||{};m[x.storeId]=x.at;map.set(x.uid,m)},
  users:function(map,d){var x=d.data();if(!x||typeof x.name!=="string")return;map.set(d.id,x)},
  bosses:function(map,d){var x=d.data();if(!x||typeof x.name!=="string")return;map.set(d.id,x)},
  follows:function(map,d){var x=d.data();if(!x||!x.from||!x.to)return;map.set(d.id,x)}
};
function listen(coll){
  var map=MAPS[coll],q=coll==="stores"?fb.query(fb.collection(S.fs,coll),fb.orderBy("createdAt","desc"),fb.limit(1000))
    :coll==="reviews"?fb.query(fb.collection(S.fs,coll),fb.orderBy("createdAt","desc"),fb.limit(3000))
    :fb.query(fb.collection(S.fs,coll),fb.limit(10000));
  /* 프로필은 서버가 받아들인 것만 보여 줌(거절될 수 있는 변경이 잠깐 보이는 문제 방지) */
  fb.onSnapshot(q,coll==="users"||coll==="bosses"?{includeMetadataChanges:true}:{},function(snap){
    var prev=coll==="users"||coll==="bosses"?new Map(map):null;
    map.clear();
    snap.docs.forEach(function(d){
      if(prev&&d.metadata.hasPendingWrites){if(prev.has(d.id))map.set(d.id,prev.get(d.id));return}
      READ[coll](map,d);
    });
    S.got[coll]=true;S.ver++;
    if(S.got.stores&&S.got.reviews&&S.got.replies&&S.got.likes&&S.got.favs&&S.got.users&&S.status==="loading")S.status="ready";
    if(!snap.metadata.fromCache){clearTimeout(slow);S.note=""}
    refresh();
  },function(){
    /* 프로필을 못 불러와도 가게·리뷰는 보이게(닉네임만 예전 방식으로 표시) */
    if(coll==="users"||coll==="bosses"||coll==="follows"){S.got[coll]=true;if(S.got.stores&&S.got.reviews&&S.got.replies&&S.got.likes&&S.got.favs&&S.status==="loading")S.status="ready";refresh();return}
    clearTimeout(slow);if(S.status==="loading")S.status="nodb";
    S.note=T("서버 연결이 끊겼습니다. 보이는 내용이 최신이 아닐 수 있습니다.");refresh();
  });
}
render();
(function(){
  var cfg=window.DNP_CONFIG||{};
  if(!cfg.firebase||!cfg.firebase.apiKey||/YOUR|여기/.test(cfg.firebase.apiKey)){clearTimeout(slow);S.status="setup";render();return}
  try{
    var app=fb.initializeApp(cfg.firebase);
    S.auth=fb.getAuth(app);S.auth.languageCode=S.lang||"ko";
    try{S.fs=fb.initializeFirestore(app,{localCache:fb.persistentLocalCache({tabManager:fb.persistentMultipleTabManager()})})}
    catch(e){S.fs=fb.getFirestore(app)}
    S.assets=true;S.db=true;
  }catch(e){console.error(e);clearTimeout(slow);S.status="nodb";render();return}
  fb.getRedirectResult(S.auth).catch(function(e){var m=authError(e);if(m)toast(m)});
  fb.onAuthStateChanged(S.auth,function(u){
    if(!u){
      S.uid=null;S.anon=true;S.account=null;
    }else{
      S.uid=u.uid;S.anon=u.isAnonymous;
      var prov=u.isAnonymous?"anonymous":(u.uid.indexOf("kakao_")===0?"kakao":u.uid.indexOf("naver_")===0?"naver":
        ((u.providerData[0]||{}).providerId==="google.com"?"google":"email"));
      S.account=u.isAnonymous?null:{name:u.displayName||"",email:u.email||"",provider:prov};
    }
    S.verified=!!u&&!u.isAnonymous&&(u.emailVerified||!isPwUser(u));
    /* 다른 기기·탭에서 인증 링크를 눌렀을 수 있으니, 이메일 계정이 아직 미인증이면 서버에서 다시 확인 */
    if(u&&!S.verified&&isPwUser(u))checkVerified(true);
    watchResv();
    S.ver++;refresh();
  });
  ["stores","reviews","replies","likes","favs","users","bosses","follows"].forEach(listen);
})();
})();
</script>
</body>
</html>
